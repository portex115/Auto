name: Публикация рилсов

on:
  schedule:
    # Каждые 10 минут (GitHub часто пропускает запуски по расписанию, поэтому с запасом).
    # Скрипт сам решает, пора ли публиковать, и догоняет пропущенные слоты (окно day_start..day_end в config.json)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        default: post
        options: [post, dry-run, check]
      only:
        description: "Опубликовать сейчас один рилс (часть имени, например short-4, или tiktok:018_x/short-1.mp4). Только для action=post"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autoposter
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # свежий main, а не коммит на момент запуска: иначе запуск, стоявший в очереди за другим,
          # работает со старым state.json, повторно заливает рилсы и падает на конфликте при сохранении
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Запуск
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          case "${{ inputs.action || 'post' }}" in
            check)   python autoposter.py check ;;
            dry-run) python autoposter.py post --dry-run ;;
            *)       python autoposter.py post ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }} ;;
          esac

      - name: Статистика
        if: always() && (inputs.action || 'post') == 'post'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python autoposter.py stats

      - name: Сохранить, что опубликовано
        if: always() && (inputs.action || 'post') == 'post'
        run: |
          git config user.name "autoposter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in queue posted queue-instagram posted-instagram queue-tiktok posted-tiktok; do
            [ -e "$d" ] && git add -A "$d"
          done
          git add state.json stats.json
          [ -f tiktok_creator.json ] && git add tiktok_creator.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Автопостер: обновление очереди $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
